<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23263a"/>
      <stop offset="1" stop-color="#0d0e14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="0.55" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#e09a12"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#3a3f55" stroke-width="1"/>
  <!-- pity ring track + progress (about 3/4 = soft pity) -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#2c3042" stroke-width="16"/>
  <path d="M128 48 A80 80 0 1 1 48 128" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="62" fill="url(#glow)"/>
  <!-- four-point sparkle -->
  <path d="M128 70 C134 112 144 122 186 128 C144 134 134 144 128 186 C122 144 112 134 70 128 C112 122 122 112 128 70 Z"
        fill="url(#star)"/>
  <circle cx="176" cy="80" r="9" fill="#b48cff"/>
  <circle cx="190" cy="66" r="4" fill="#d9c7ff"/>
</svg>
