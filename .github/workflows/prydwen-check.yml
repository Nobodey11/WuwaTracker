name: prydwen-check
# Weekly: do the Prydwen parsers still understand Prydwen's live pages? A failed run means a layout change
# (GitHub emails you), so the parser can be fixed before the Prydwen / Codes / Calendar tabs break in the app.
on:
  schedule:
    - cron: "17 7 * * 1"        # Mondays 07:17 UTC
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/prydwen_check.py
