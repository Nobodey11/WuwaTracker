name: tests
# Runs on every push / pull request: validates game_data.json and runs the core tests.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest openpyxl
      - run: python tools/new_patch.py check
      - run: python -m pytest -q tests
